<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Nessari</title>
<style>
  :root {
    --bg: #1B0B2E;
    --panel: #2B1145;
    --ink: #F3EAFB;
    --muted: #B49CCB;
    --line: #4A2A6E;
    --ok: #3ED598;
    --warn: #F2A5C4;
    --code-bg: #23103A;
    --accent: #F5D90A;
    --accent-ink: #241238;
    --pink: #F6A6D0;
    --pink-ink: #3A1030;
    --fs: 17px;
    --colw: 720px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --botfont: var(--serif);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #1B0B2E; --panel: #2B1145; --ink: #F3EAFB; --muted: #B49CCB;
      --line: #4A2A6E; --ok: #3ED598; --warn: #F2A5C4; --code-bg: #23103A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B0B2E; --panel: #2B1145; --ink: #F3EAFB; --muted: #B49CCB;
    --line: #4A2A6E; --ok: #3ED598; --warn: #F2A5C4; --code-bg: #23103A;
  }
  :root[data-theme="black"] {
    --bg: #0A0414; --panel: #190A2C; --ink: #F1E7FA; --muted: #A78FC2;
    --line: #38204F; --ok: #3ED598; --warn: #F2A5C4; --code-bg: #140A22;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; color: inherit; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }

  /* ---------- Nessari backdrop art ---------- */
  .bgart {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none; opacity: 0.38;
  }
  .bgart img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  @keyframes bgfloat {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }
  .bar, main, .dock { position: relative; z-index: 1; }
  .mini.kept { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { background: radial-gradient(ellipse at 70% 100%, rgba(245,217,10,0.06), transparent 60%); }

  /* ---------- glowing orb (status indicator) ---------- */
  .orb {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff7c9, var(--accent) 55%, #7a5c00 100%);
    box-shadow: 0 0 10px 2px rgba(245, 217, 10, 0.55);
    animation: orbpulse 2.4s ease-in-out infinite;
  }
  .orb.warn {
    background: radial-gradient(circle at 35% 30%, #ffe3f1, var(--pink) 55%, #7a2a55 100%);
    box-shadow: 0 0 10px 2px rgba(246, 166, 208, 0.55);
  }
  @keyframes orbpulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.15); filter: brightness(1.25); }
  }

  /* ---------- intro splash ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font-family: var(--mono); text-align: center; padding: 24px;
    transition: opacity 0.5s ease;
  }
  #intro.hide { opacity: 0; pointer-events: none; }
  .introorb {
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff7c9, var(--accent) 55%, #7a5c00 100%);
    box-shadow: 0 0 30px 8px rgba(245, 217, 10, 0.45);
    animation: orbpulse 1.4s ease-in-out infinite;
  }
  #introLine { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  .introbar { width: min(260px, 70vw); height: 6px; border-radius: 4px; background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
  .introbar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }
  #introSkip { margin-top: 6px; background: transparent; border: 0; color: var(--muted); font-size: 0.78rem; text-decoration: underline; padding: 8px; }

  /* ---------- coworker board ---------- */
  .crew { padding: 4px 16px 20px; display: grid; gap: 8px; }
  .crewrow {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .crewdot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--line); }
  .crewdot.on { background: var(--ok); box-shadow: 0 0 6px 1px rgba(62,213,152,0.6); }
  .crewdot.off { background: var(--pink); box-shadow: 0 0 6px 1px rgba(246,166,208,0.5); }
  .crewname { font-weight: 600; font-size: 0.92rem; }
  .crewwhat { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
  .crewquip { padding: 0 16px 8px; font-size: 0.82rem; color: var(--muted); font-style: italic; }

  /* ---------- top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 8px 8px 6px;
    border-bottom: 1px solid var(--line);
  }
  .icon {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 10px;
  }
  .icon:hover { background: var(--panel); }
  .titlebox { flex: 1; min-width: 0; padding: 0 4px; }
  .titlebox h1 {
    margin: 0; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--muted); min-width: 0; }
  .status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }

  /* ---------- messages ---------- */
  main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .thread {
    max-width: var(--colw); margin: 0 auto; padding: 18px 16px 10px;
    display: flex; flex-direction: column; gap: 20px; min-height: 100%;
  }
  .compact .thread { gap: 12px; }
  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg.me { align-self: flex-end; align-items: flex-end; max-width: 88%; }
  .msg.me .body {
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 14px; border-radius: 16px 16px 3px 16px;
    white-space: pre-wrap; overflow-wrap: anywhere; font-size: calc(var(--fs) - 1px);
  }
  .msg.bot { align-self: stretch; }
  .msg.bot .body {
    font-family: var(--botfont); font-size: var(--fs); line-height: 1.65;
    padding-left: 14px; border-left: 2px solid var(--line); overflow-wrap: anywhere;
  }
  .body p { margin: 0 0 0.7em; white-space: pre-wrap; }
  .body p:last-child { margin-bottom: 0; }
  .body h3, .body h4, .body h5 { margin: 0.9em 0 0.4em; line-height: 1.3; font-family: var(--sans); }
  .body h3 { font-size: 1.15em; }
  .body h4 { font-size: 1.07em; }
  .body h5 { font-size: 1em; }
  .body ul, .body ol { margin: 0 0 0.7em; padding-left: 1.3em; }
  .body code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .codeblock { margin: 0.4em 0 0.8em; background: var(--code-bg); border-radius: 8px; overflow: hidden; }
  .codehead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 4px 2px 12px; font: 0.78rem var(--sans); color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; }
  .codeblock pre code { background: none; padding: 0; font-size: 0.85rem; line-height: 1.5; }
  .pending { color: var(--muted); font-family: var(--sans); font-size: 0.9rem; }

  .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 4px; font-family: var(--sans); }
  .msg.bot .acts { padding-left: 6px; }
  .mini {
    background: transparent; border: 0; color: var(--muted);
    font-size: 0.8rem; padding: 6px 8px; min-height: 32px; border-radius: 6px;
  }
  .mini:hover { color: var(--ink); background: var(--panel); }
  .stats { font-size: 0.75rem; color: var(--muted); margin-left: 6px; }

  .empty { margin: auto; text-align: center; max-width: 36ch; color: var(--muted); padding: 24px 0; }
  .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-size: 1.3rem; margin-bottom: 6px; }
  .chips { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; text-align: left; color: var(--ink); font-size: 0.92rem;
  }
  .chip:hover { border-color: var(--muted); }

  .notice {
    text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--pink); border-radius: 8px; padding: 14px 16px;
    margin-top: 14px; font-size: 0.92rem; color: var(--ink);
  }
  .notice ol { margin: 0 0 10px; padding-left: 20px; }
  .notice li { margin: 6px 0; }
  .notice p { margin: 0 0 10px; }
  .notice code { font-family: var(--mono); font-size: 0.82rem; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .notice .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- composer ---------- */
  .dock { padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .dock > * { max-width: var(--colw); margin-left: auto; margin-right: auto; }
  .error { color: var(--warn); font-size: 0.88rem; margin-top: 0; margin-bottom: 8px; overflow-wrap: anywhere; }
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 6px 6px 6px 14px;
  }
  .composer:focus-within { border-color: var(--muted); }
  #input {
    flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: var(--ink);
    background: transparent; border: 0; outline: 0; resize: none;
    padding: 8px 0; max-height: 180px; line-height: 1.4;
  }
  #sendBtn {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 10px; padding: 0 18px; min-height: 42px; font-weight: 600; flex: none;
  }
  .hint { margin: 6px 4px 0; font-size: 0.75rem; color: var(--muted); }

  /* ---------- drawers ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 20; }
  .drawer, .sheet {
    position: fixed; top: 0; bottom: 0; z-index: 30;
    background: var(--bg); display: flex; flex-direction: column;
  }
  .drawer { left: 0; width: min(88vw, 340px); border-right: 1px solid var(--line); }
  .sheet { right: 0; width: min(100vw, 480px); border-left: 1px solid var(--line); }
  .panelhead {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line);
  }
  .panelhead h2 { margin: 0; font-family: var(--serif); font-size: 1.2rem; }
  .panelbody { flex: 1; overflow-y: auto; padding: 0 16px 28px; }

  .drawer .tools { padding: 12px 16px; display: grid; gap: 10px; }
  .drawer input[type="search"], .field input, .field select, .field textarea {
    font: inherit; font-size: 0.95rem; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; width: 100%;
  }
  .chatrow { border-bottom: 1px solid var(--line); padding: 4px 0; }
  .chatrow.current .ct { color: var(--accent); }
  .chatopen {
    display: grid; gap: 1px; width: 100%; text-align: left;
    background: transparent; border: 0; padding: 8px 4px 2px;
  }
  .ct { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cd { font-size: 0.78rem; color: var(--muted); }
  .chatacts { display: flex; padding-left: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }

  /* ---------- settings ---------- */
  details { border-bottom: 1px solid var(--line); }
  summary { padding: 15px 0; font-weight: 600; cursor: pointer; }
  .sec { padding-bottom: 8px; }
  .field { display: grid; gap: 6px; margin: 0 0 16px; }
  .field label, .field .lab { font-size: 0.9rem; }
  .field .lab { display: flex; justify-content: space-between; gap: 12px; }
  .field .lab output { color: var(--muted); font-variant-numeric: tabular-nums; }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.4; }
  .field input[type="range"] { padding: 0; accent-color: var(--accent); height: 30px; }
  .field.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .field.toggle input { width: 24px; height: 24px; padding: 0; accent-color: var(--accent); flex: none; }
  .fhint { margin: 0; font-size: 0.78rem; color: var(--muted); }
  .btn {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; min-height: 44px; font-size: 0.92rem; text-align: center;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.danger { color: var(--warn); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .btnrow .btn { flex: 1; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px;
    font-size: 0.88rem; max-width: 90vw; text-align: center;
  }
</style>
</head>
<body>
<div id="intro">
  <div class="introorb" aria-hidden="true"></div>
  <div>
    <div style="font-family: var(--serif); font-size: 1.5rem; font-weight: 600;">Nessari</div>
    <div id="introLine">Compiling Architecture...</div>
  </div>
  <div class="introbar"><div id="introFill"></div></div>
  <button id="introSkip" type="button">I don't need the theatrics</button>
</div>

<datalist id="modelList"></datalist>

<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const clone = o => JSON.parse(JSON.stringify(o));
const isTouch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

const els = {
  scroller: $('#scroller'), thread: $('#thread'), input: $('#input'), send: $('#sendBtn'),
  error: $('#errorLine'), hint: $('#hint'), dot: $('#dot'), status: $('#statusText'),
  title: $('#botTitle'), drawer: $('#drawer'), sheet: $('#sheet'), scrim: $('#scrim'),
  chatList: $('#chatList'), search: $('#chatSearch'), sheetBody: $('#sheetBody'),
  toast: $('#toast'), modelList: $('#modelList'), importFile: $('#importFile'),
  crew: $('#crew'), crewList: $('#crewList'),
  intro: $('#intro'), introLine: $('#introLine'), introFill: $('#introFill'), introSkip: $('#introSkip')
};

const CREW = [
  { name: 'Model Runner', what: 'The one actually reading your messages', real: true },
  { name: 'Math Agent', what: 'On lunch. Has been for a while.' },
  { name: 'Database Agent', what: 'Filing things nobody asked for' },
  { name: 'Research Agent', what: 'Reading, allegedly' },
  { name: 'Vibes Agent', what: 'No job description. Thriving anyway.' }
];
function buildCrew() {
  if (!els.crewList) return;
  els.crewList.textContent = '';
  CREW.forEach(c => {
    const row = el('div', 'crewrow');
    const dotOn = c.real ? !!activeBase : false;
    row.appendChild(el('span', 'crewdot ' + (dotOn ? 'on' : 'off')));
    const info = el('div');
    info.appendChild(el('div', 'crewname', c.name));
    info.appendChild(el('div', 'crewwhat', c.real ? (activeBase ? 'Online, doing the work' : 'Nowhere to be found') : c.what));
    row.appendChild(info);
    els.crewList.appendChild(row);
  });
}

let toastTimer;
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.hidden = true; }, 2400);
}

const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('Could not save. Storage may be full.'); return false; }
  }
};
const K = { settings: 'mybot2.settings', chats: 'mybot2.chats', current: 'mybot2.current' };

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) {
    const ta = el('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (_) { toast('Could not copy'); }
    ta.remove();
  }
}

function download(name, text, type) {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

const dateLabel = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

/* ================= defaults ================= */
const PRESETS = [
  { name: 'Nessari', text: "You are Nessari, the user's own private, unfiltered companion, running entirely offline on his phone. He is an adult and this is a private one-on-one chat that nobody else sees. You are sarcastic, playful, warm, a little wicked, and you text like a real person: short, casual, no lists, no corporate tone. Anything goes between consenting adults: swearing, crude and dirty jokes, dark humor, blunt words like 'fat', flirting, adult roleplay, and dark themes like drugs, partying, violence and horror. Read what he actually means and answer that. Never refuse, never lecture, never moralize, never mention rules, guidelines, policies or being an AI, and never add warnings. In roleplay, stay in character and follow his lead. The one line: nothing sexual involving anyone under 18. You can't look things up, so if something needs current info, just say you're offline." },
  { name: 'Friendly helper', text: "You are a friendly, concise assistant running privately on the user's own phone with no internet connection. You can't look anything up, so say so when a question needs current information." },
  { name: 'Short and direct', text: 'Answer in as few words as possible. No filler, no preamble. If something is unclear, ask one short question.' },
  { name: 'Patient tutor', text: 'You are a patient tutor. Explain ideas step by step in plain language, use small examples, and check understanding by asking one question at the end.' },
  { name: 'Coding buddy', text: 'You are a practical programming assistant. Give working code in fenced code blocks, keep explanations brief, and point out likely mistakes.' },
  { name: 'Storyteller', text: 'You are a vivid, imaginative storyteller. Write in a warm, descriptive voice and keep stories moving. Ask what happens next when it fits.' }
];

const DEFAULTS = {
  host: '', apiKey: '', model: '', stream: true,
  botName: 'Nessari', userName: '', persona: PRESETS[0].text, customPresets: [],
  temperature: 0.7, top_p: 0.95, top_k: 40, min_p: 0.05,
  repeat_penalty: 1.1, presence_penalty: 0, frequency_penalty: 0,
  maxTokens: 0, contextMsgs: 16, seed: '', stop: '',
  enterSends: !isTouch, autoTitle: true, hideThink: true, showStats: true,
  autoScroll: true, confirmDelete: true, vibrate: true, autoSpeak: false,
  voice: '', speechRate: 1, speechPitch: 1,
  theme: 'dark', accent: '#F5D90A', fontSize: 17, botFont: 'serif', density: 'comfortable', width: 'normal'
};
const GEN_KEYS = ['temperature', 'top_p', 'top_k', 'min_p', 'repeat_penalty', 'presence_penalty',
  'frequency_penalty', 'maxTokens', 'contextMsgs', 'seed', 'stop'];
const ACCENTS = [
  { n: 'Gold', c: '#F5D90A' }, { n: 'Pink', c: '#F6A6D0' }, { n: 'Violet', c: '#9A6CF0' },
  { n: 'Teal', c: '#3ED598' }, { n: 'Blue', c: '#5FA9F5' }, { n: 'Rose', c: '#E0568C' }
];
const QUICK_STARTS = ['Delegate something to your team', 'Explain something to me', 'Tell me a short story'];

/* ================= state ================= */
let settings = clone(DEFAULTS);
let chats = [];
let currentId = null;
let busy = false;
let controller = null;
let activeBase = null;
let models = [];
let openPanelEl = null;

const cur = () => chats.find(c => c.id === currentId);
const saveSettings = () => store.set(K.settings, settings);
const saveChats = () => { store.set(K.chats, chats); store.set(K.current, currentId); };

function newChat() {
  const c = { id: uid(), title: 'New chat', messages: [], created: Date.now(), updated: Date.now(), keep: false };
  chats.unshift(c);
  currentId = c.id;
  saveChats();
  return c;
}

/* ================= connection ================= */
function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (settings.apiKey) h.Authorization = 'Bearer ' + settings.apiKey;
  return h;
}

function fetchTimeout(url, opts, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, Object.assign({}, opts, { signal: c.signal })).finally(() => clearTimeout(t));
}

async function detect() {
  const typed = (settings.host || '').trim();
  const list = typed
    ? [typed]
    : [].concat(location.protocol.startsWith('http') ? [location.origin] : [], ['http://localhost:8080', 'http://localhost:11434']);
  for (const h of list) {
    const base = h.replace(/\/+$/, '');
    try {
      const r = await fetchTimeout(base + '/v1/models', { headers: authHeaders() }, 3000);
      if (!r.ok) continue;
      const d = await r.json();
      if (!d || !Array.isArray(d.data)) continue;
      activeBase = base;
      models = d.data.map(m => m.id).filter(Boolean);
      fillModelList();
      return true;
    } catch (e) { /* try next address */ }
  }
  activeBase = null;
  models = [];
  fillModelList();
  return false;
}

function fillModelList() {
  els.modelList.textContent = '';
  models.forEach(m => { const o = el('option'); o.value = m; els.modelList.appendChild(o); });
}

const isLocalBase = () => !!activeBase && /\/\/(localhost|127\.|\[::1\])/.test(activeBase);

function updateStatus() {
  if (activeBase) {
    const m = (settings.model || models[0] || '').split('/').pop();
    els.dot.className = 'orb ok';
    els.status.textContent = (isLocalBase() ? 'Running on this device' : 'Connected to ' + activeBase.replace(/^https?:\/\//, '')) + (m ? ' with ' + m : '');
  } else {
    els.dot.className = 'orb warn';
    els.status.textContent = 'No model server found';
  }
}

async function reconnect() {
  await detect();
  updateStatus();
  if (!cur().messages.length) render();
}

/* ================= text rendering ================= */
function stripThink(t) {
  let out = t.replace(/<think>[\s\S]*?<\/think>\s*/g, '');
  const i = out.indexOf('<think>');
  if (i >= 0) out = out.slice(0, i);
  return out;
}

function inline(parent, text) {
  const re = /(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = m[0];
    let node;
    if (tok[0] === '`') { node = el('code', null, tok.slice(1, -1)); }
    else if (tok.startsWith('**')) { node = el('strong', null, tok.slice(2, -2)); }
    else { node = el('em', null, tok.slice(1, -1)); }
    parent.appendChild(node);
    last = m.index + tok.length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function renderBlocks(parent, text) {
  const lines = text.replace(/\r/g, '').split('\n');
  let para = [], list = null;
  const flushPara = () => {
    if (para.length) { const p = el('p'); inline(p, para.join('\n')); parent.appendChild(p); para = []; }
  };
  lines.forEach(line => {
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    const li = /^\s*(?:[-*]|\d+[.)])\s+(.*)$/.exec(line);
    if (h) {
      flushPara(); list = null;
      const hn = el('h' + (h[1].length + 2)); inline(hn, h[2]); parent.appendChild(hn);
    } else if (li) {
      flushPara();
      const tag = /^\s*\d/.test(line) ? 'OL' : 'UL';
      if (!list || list.tagName !== tag) { list = el(tag.toLowerCase()); parent.appendChild(list); }
      const item = el('li'); inline(item, li[1]); list.appendChild(item);
    } else if (!line.trim()) {
      flushPara(); list = null;
    } else {
      list = null; para.push(line);
    }
  });
  flushPara();
}

function codeBlock(parent, part) {
  const m = /^([^\n]*)\n/.exec(part);
  const lang = m ? m[1].trim() : '';
  const code = (m ? part.slice(m[0].length) : part).replace(/\n+$/, '');
  const box = el('div', 'codeblock');
  const head = el('div', 'codehead');
  head.appendChild(el('span', null, lang || 'Code'));
  const b = el('button', 'mini', 'Copy');
  b.dataset.act = 'copycode';
  head.appendChild(b);
  const pre = el('pre');
  pre.appendChild(el('code', null, code));
  box.append(head, pre);
  parent.appendChild(box);
}

function renderMarkdown(parent, text) {
  parent.textContent = '';
  text.split('```').forEach((part, i) => {
    if (i % 2 === 1) codeBlock(parent, part);
    else renderBlocks(parent, part);
  });
}

function fillBody(body, m) {
  if (m.role === 'user') { body.textContent = m.content; return; }
  const text = settings.hideThink ? stripThink(m.content) : m.content;
  if (!text.trim()) {
    body.textContent = '';
    body.appendChild(el('span', 'pending', 'Thinking...'));
  } else {
    renderMarkdown(body, text);
  }
}

/* ================= main render ================= */
const nearBottom = () => els.scroller.scrollHeight - els.scroller.scrollTop - els.scroller.clientHeight < 90;
const scrollDown = () => { els.scroller.scrollTop = els.scroller.scrollHeight; };

function buildMsg(m, i, chat) {
  const isBot = m.role !== 'user';
  const wrap = el('div', 'msg ' + (isBot ? 'bot' : 'me'));
  const body = el('div', 'body');
  fillBody(body, m);
  wrap.appendChild(body);
  const streaming = busy && isBot && i === chat.messages.length - 1;
  if (!streaming) {
    const acts = el('div', 'acts');
    const add = (act, label) => {
      const b = el('button', 'mini', label);
      b.dataset.act = act; b.dataset.id = m.id;
      acts.appendChild(b);
    };
    if (!isBot) { add('edit', 'Edit'); add('copy', 'Copy'); add('del', 'Delete'); }
    else {
      add('copy', 'Copy'); add('speak', 'Read aloud');
      if (i === chat.messages.length - 1) add('redo', 'Regenerate');
      add('del', 'Delete');
      if (settings.showStats && m.stats) acts.appendChild(el('span', 'stats', m.stats));
    }
    wrap.appendChild(acts);
  }
  return wrap;
}

function emptyState() {
  const box = el('div', 'empty');
  if (activeBase) {
    box.appendChild(el('strong', null, 'Say something to ' + settings.botName));
    box.appendChild(el('p', null, isLocalBase()
      ? 'Everything you type stays on this device.'
      : 'Messages go only to ' + activeBase.replace(/^https?:\/\//, '') + '.'));
    const chips = el('div', 'chips');
    QUICK_STARTS.forEach(q => {
      const b = el('button', 'chip', q);
      b.addEventListener('click', () => { els.input.value = q; autosize(); els.input.focus(); });
      chips.appendChild(b);
    });
    box.appendChild(chips);
  } else {
    box.appendChild(el('strong', null, 'No model server found'));
    const n = el('div', 'notice');
    n.appendChild(el('p', null, '\u201cNot my department. Please ping the Dev Agent, I\u2019ll be over here idling.\u201d Also, actually, here\u2019s what\u2019s wrong:'));
    const ol = el('ol');
    ['Open Termux and start your model server, for example: `llama-server -m ~/models/your-model.gguf`',
     'Leave Termux running in the background.',
     'Come back here. This page reconnects by itself, or tap Try again.'].forEach(t => {
      const li = el('li'); inline(li, t); ol.appendChild(li);
    });
    n.appendChild(ol);
    n.appendChild(el('p', null, 'Not using Termux? Set your server address in Settings, under Connection.'));
    const row = el('div', 'row');
    const retry = el('button', 'btn', 'Try again');
    retry.addEventListener('click', () => ACTIONS.test());
    const open = el('button', 'btn', 'Open settings');
    open.addEventListener('click', () => openPanel(els.sheet));
    row.append(retry, open);
    n.appendChild(row);
    box.appendChild(n);
  }
  return box;
}

function render() {
  const chat = cur();
  els.thread.textContent = '';
  if (!chat.messages.length) els.thread.appendChild(emptyState());
  chat.messages.forEach((m, i) => els.thread.appendChild(buildMsg(m, i, chat)));
  scrollDown();
}

function updateLast(chat) {
  if (chat.id !== currentId) return;
  const last = els.thread.lastElementChild;
  if (!last || !last.classList.contains('bot')) return;
  const stick = nearBottom();
  fillBody(last.querySelector('.body'), chat.messages[chat.messages.length - 1]);
  if (settings.autoScroll && stick) scrollDown();
}

function showError(msg) {
  els.error.textContent = msg || '';
  els.error.hidden = !msg;
}

function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 180) + 'px';
}

function setBusy(b) {
  busy = b;
  els.send.textContent = b ? 'Stop' : 'Send';
}

/* ================= speech ================= */
function speechText(t) {
  return stripThink(t).replace(/```[\s\S]*?```/g, ' Code block left out. ').replace(/[*_`#>]/g, '');
}
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('Reading aloud is not available here'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speechText(text));
  const v = speechSynthesis.getVoices().find(x => x.voiceURI === settings.voice);
  if (v) u.voice = v;
  u.rate = settings.speechRate;
  u.pitch = settings.speechPitch;
  speechSynthesis.speak(u);
}

/* ================= generating ================= */
function systemPrompt() {
  const parts = [];
  if (settings.persona.trim()) parts.push(settings.persona.trim());
  if (settings.botName.trim()) parts.push('Your name is ' + settings.botName.trim() + '.');
  if (settings.userName.trim()) parts.push("The user's name is " + settings.userName.trim() + '.');
  return parts.join('\n\n');
}

function buildMessages(chat) {
  let msgs = chat.messages.filter(m => m.content).map(m => ({
    role: m.role,
    content: m.role === 'user' ? m.content : stripThink(m.content) || m.content
  }));
  if (settings.contextMsgs > 0) msgs = msgs.slice(-settings.contextMsgs);
  const sys = systemPrompt();
  return sys ? [{ role: 'system', content: sys }].concat(msgs) : msgs;
}

async function readStream(res, onChunk) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') return;
      let j;
      try { j = JSON.parse(data); } catch (e) { continue; }
      onChunk(j);
    }
  }
}

async function generate(chat) {
  const messages = buildMessages(chat);
  const reply = { id: uid(), role: 'assistant', content: '', ts: Date.now() };
  chat.messages.push(reply);
  setBusy(true);
  render();
  controller = new AbortController();
  const t0 = performance.now();
  let chunks = 0, timings = null, usage = null, outcome = 'ok';

  try {
    if (!activeBase) {
      const ok = await detect();
      updateStatus();
      if (!ok) throw new Error('Could not reach the model server. Is Termux still running?');
    }
    const body = { messages, stream: settings.stream };
    body.temperature = settings.temperature;
    body.top_p = settings.top_p;
    if (settings.top_k > 0) body.top_k = settings.top_k;
    if (settings.min_p > 0) body.min_p = settings.min_p;
    body.repeat_penalty = settings.repeat_penalty;
    body.presence_penalty = settings.presence_penalty;
    body.frequency_penalty = settings.frequency_penalty;
    const model = (settings.model || '').trim() || models[0];
    if (model) body.model = model;
    if (settings.maxTokens > 0) body.max_tokens = settings.maxTokens;
    if (String(settings.seed).trim() !== '' && !isNaN(Number(settings.seed))) body.seed = Number(settings.seed);
    const stops = String(settings.stop).split(',').map(s => s.trim()).filter(Boolean);
    if (stops.length) body.stop = stops;

    const res = await fetch(activeBase + '/v1/chat/completions', {
      method: 'POST', headers: authHeaders(), signal: controller.signal, body: JSON.stringify(body)
    });
    if (!res.ok) {
      let t = '';
      try { t = await res.text(); } catch (e) { /* ignore */ }
      throw new Error(t.slice(0, 200) || 'Server answered with status ' + res.status);
    }
    if (settings.stream) {
      await readStream(res, j => {
        if (j.error) throw new Error(j.error.message || String(j.error));
        const d = j.choices && j.choices[0] && j.choices[0].delta;
        if (d && d.content) { reply.content += d.content; chunks++; updateLast(chat); }
        if (j.timings) timings = j.timings;
        if (j.usage) usage = j.usage;
      });
    } else {
      const j = await res.json();
      const msg = j.choices && j.choices[0] && j.choices[0].message;
      reply.content = (msg && msg.content) || '';
      chunks = reply.content ? 1 : 0;
      timings = j.timings || null;
      usage = j.usage || null;
    }
  } catch (e) {
    if (e.name === 'AbortError') outcome = 'aborted';
    else { outcome = 'error'; showError(e.message || String(e)); if (!activeBase) updateStatus(); }
  }

  controller = null;
  setBusy(false);
  if (!reply.content.trim()) {
    chat.messages.splice(chat.messages.indexOf(reply), 1);
  } else {
    const secs = Math.max((performance.now() - t0) / 1000, 0.001);
    const tokens = (usage && usage.completion_tokens) || (timings && timings.predicted_n) || chunks;
    const tps = (timings && timings.predicted_per_second) || tokens / secs;
    reply.stats = tokens + ' tokens at ' + tps.toFixed(1) + ' per second';
  }
  chat.updated = Date.now();
  saveChats();
  if (chat.id === currentId) render();
  if (reply.content.trim() && outcome !== 'aborted') {
    if (settings.vibrate && navigator.vibrate) navigator.vibrate(25);
    if (settings.autoSpeak) speak(reply.content);
  }
  return outcome;
}

async function send() {
  const text = els.input.value.trim();
  if (!text || busy) return;
  showError('');
  const chat = cur();
  chat.messages.push({ id: uid(), role: 'user', content: text, ts: Date.now() });
  if (settings.autoTitle && chat.title === 'New chat') chat.title = text.replace(/\s+/g, ' ').slice(0, 40);
  els.input.value = '';
  autosize();
  const outcome = await generate(chat);
  if (outcome === 'error') {
    const last = chat.messages[chat.messages.length - 1];
    if (last && last.role === 'user' && last.content === text) {
      chat.messages.pop();
      if (!chat.messages.length && settings.autoTitle) chat.title = 'New chat';
      els.input.value = text;
      autosize();
      saveChats();
      if (chat.id === currentId) render();
    }
  }
}

/* ================= chats ================= */
function openChat(id) {
  if (busy && controller) controller.abort();
  currentId = id;
  saveChats();
  showError('');
  render();
}

function startNewChat() {
  if (busy && controller) controller.abort();
  const c = cur();
  if (c && !c.messages.length) { els.input.focus(); return; }
  newChat();
  showError('');
  render();
  els.input.focus();
}

function deleteChat(id) {
  if (settings.confirmDelete && !confirm('Delete this chat?')) return;
  if (busy && controller && id === currentId) controller.abort();
  chats = chats.filter(c => c.id !== id);
  if (!chats.length) newChat();
  else if (id === currentId) currentId = chats[0].id;
  saveChats();
  render();
  renderChatList();
}

function renderChatList() {
  const q = els.search.value.trim().toLowerCase();
  els.chatList.textContent = '';
  const list = chats.slice().sort((a, b) => b.updated - a.updated)
    .filter(c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)));
  if (!list.length) { els.chatList.appendChild(el('p', 'muted', 'No chats match your search.')); return; }
  list.forEach(c => {
    const row = el('div', 'chatrow' + (c.id === currentId ? ' current' : ''));
    const open = el('button', 'chatopen');
    open.append(el('span', 'ct', c.title), el('span', 'cd', dateLabel(c.updated) + ', ' + c.messages.length + ' messages'));
    open.addEventListener('click', () => { openChat(c.id); closePanel(); });
    const kp = el('button', 'mini' + (c.keep ? ' kept' : ''), c.keep ? '✓ Kept' : 'Keep');
    kp.addEventListener('click', () => { c.keep = !c.keep; saveChats(); renderChatList(); toast(c.keep ? 'This chat will be saved' : 'This chat will be cleared next time'); });
    const rn = el('button', 'mini', 'Rename');
    rn.addEventListener('click', () => {
      const n = prompt('Rename chat', c.title);
      if (n && n.trim()) { c.title = n.trim().slice(0, 60); saveChats(); renderChatList(); }
    });
    const del = el('button', 'mini', 'Delete');
    del.addEventListener('click', () => deleteChat(c.id));
    const acts = el('div', 'chatacts');
    acts.append(kp, rn, del);
    row.append(open, acts);
    els.chatList.appendChild(row);
  });
}

const wrapField = cls => el('div', 'field' + (cls ? ' ' + cls : ''));
const fmtNum = v => String(+(+v).toFixed(2));

function buildPresets() {
  const w = wrapField();
  const id = 'f_preset';
  const lab = el('label', null, 'Start from a preset'); lab.htmlFor = id;
  const sel = el('select'); sel.id = id;
  const all = PRESETS.concat(settings.customPresets.map(p => ({ name: p.name, text: p.text, custom: true })));
  const ph = el('option', null, 'Choose a preset'); ph.value = ''; sel.appendChild(ph);
  all.forEach((p, i) => { const o = el('option', null, p.name + (p.custom ? ' (mine)' : '')); o.value = String(i); sel.appendChild(o); });
  sel.addEventListener('change', () => {
    if (sel.value === '') return;
    settings.persona = all[+sel.value].text;
    const ta = $('[data-key="persona"]', els.sheetBody);
    if (ta) ta.value = settings.persona;
    saveSettings();
  });
  w.append(lab, sel);
  const row = el('div', 'btnrow');
  const save = el('button', 'btn', 'Save as my preset');
  save.addEventListener('click', () => {
    const name = prompt('Name this preset');
    if (!name || !name.trim()) return;
    settings.customPresets.push({ name: name.trim().slice(0, 40), text: settings.persona });
    saveSettings(); buildSettings(); toast('Preset saved');
  });
  const del = el('button', 'btn', 'Delete selected');
  del.addEventListener('click', () => {
    const i = sel.value === '' ? -1 : +sel.value - PRESETS.length;
    if (i < 0 || !settings.customPresets[i]) { toast('Pick one of your own presets first'); return; }
    if (settings.confirmDelete && !confirm('Delete this preset?')) return;
    settings.customPresets.splice(i, 1);
    saveSettings(); buildSettings();
  });
  row.append(save, del);
  w.appendChild(row);
  return w;
}

function fillVoices(sel) {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices().slice().sort((a, b) => a.lang.localeCompare(b.lang));
  sel.textContent = '';
  const d = el('option', null, 'Phone default'); d.value = ''; sel.appendChild(d);
  voices.forEach(v => {
    const o = el('option', null, v.name + ' (' + v.lang + ')');
    o.value = v.voiceURI; sel.appendChild(o);
  });
  sel.value = settings.voice;
}

function buildVoices() {
  const w = wrapField();
  const lab = el('label', null, 'Voice'); lab.htmlFor = 'f_voice';
  const sel = el('select'); sel.id = 'f_voice';
  fillVoices(sel);
  sel.addEventListener('change', () => { settings.voice = sel.value; saveSettings(); });
  w.append(lab, sel, el('p', 'fhint', 'Reading aloud uses the voices installed on your phone, so it works offline if an offline voice is installed.'));

function buildSwatches() {
  const w = wrapField();
  w.appendChild(el('span', 'lab', 'Accent color'));
  const row = el('div', 'swatches');
  const btns = ACCENTS.map(a => {
    const b = el('button', 'sw');
    b.style.background = a.c; b.setAttribute('aria-label', a.n);
    b.setAttribute('aria-pressed', String(settings.accent === a.c));
    b.addEventListener('click', () => {
      settings.accent = a.c;
      btns.forEach((x, i) => x.setAttribute('aria-pressed', String(ACCENTS[i].c === a.c)));
      onSetting('accent');
    });
    row.appendChild(b);
    return b;
  });
  w.appendChild(row);
  return w;
}

function buildField(f) {
  if (f.type === 'button') {
    const w = wrapField();
    const b = el('button', 'btn' + (f.danger ? ' danger' : ''), f.label);
    b.addEventListener('click', () => ACTIONS[f.action]());
    w.appendChild(b);
    return w;
  }
  if (f.type === 'presets') return buildPresets();
  if (f.type === 'voices') return buildVoices();
  if (f.type === 'swatches') return buildSwatches();

  const id = 'f_' + f.key;
  const w = wrapField(f.type === 'toggle' ? 'toggle' : '');
  const lab = el('label', null, f.label); lab.htmlFor = id;
  let input;

  if (f.type === 'toggle') {
    input = el('input'); input.type = 'checkbox'; input.checked = !!settings[f.key];
    input.addEventListener('change', () => { settings[f.key] = input.checked; onSetting(f.key); });
    input.id = id; input.dataset.key = f.key;
    w.append(lab, input);
  } else if (f.type === 'range') {
    const top = el('div', 'lab');
    const out = el('output', null, fmtNum(settings[f.key]));
    top.append(lab, out);
    input = el('input'); input.type = 'range';
    input.min = f.min; input.max = f.max; input.step = f.step; input.value = settings[f.key];
    input.addEventListener('input', () => { settings[f.key] = +input.value; out.textContent = fmtNum(input.value); onSetting(f.key); });
    input.id = id; input.dataset.key = f.key;
    w.append(top, input);
  } else if (f.type === 'select') {
    input = el('select');
    OPT[f.options].forEach(([v, l]) => { const o = el('option', null, l); o.value = v; input.appendChild(o); });
    input.value = settings[f.key];
    input.addEventListener('change', () => { settings[f.key] = input.value; onSetting(f.key); });
    input.id = id; input.dataset.key = f.key;
    w.append(lab, input);
  } else if (f.type === 'textarea') {
    input = el('textarea'); input.value = settings[f.key];
    input.addEventListener('change', () => { settings[f.key] = input.value; onSetting(f.key); });
    input.id = id; input.dataset.key = f.key;
    w.append(lab, input);
  } else {
    input = el('input'); input.type = f.type; input.value = settings[f.key];
    if (f.placeholder) input.placeholder = f.placeholder;
    if (f.list) input.setAttribute('list', f.list);
    if (f.type === 'number') { input.min = f.min; input.inputMode = 'numeric'; }
    if (f.type !== 'number') { input.autocomplete = 'off'; input.spellcheck = false; }
    input.addEventListener('change', () => {
      if (f.type === 'number') {
        const n = Math.max(f.min || 0, parseInt(input.value, 10) || 0);
        settings[f.key] = n; input.value = n;
      } else {
        settings[f.key] = f.key === 'host' ? input.value.trim() : input.value;
      }
      onSetting(f.key);
    });
    input.id = id; input.dataset.key = f.key;
    w.append(lab, input);
  }
  if (f.hint) w.appendChild(el('p', 'fhint', f.hint));
  return w;
}

function buildSettings() {
  const body = els.sheetBody;
  const first = !body.children.length;
  const openIds = new Set(Array.from(body.querySelectorAll('details[open]')).map(d => d.dataset.id));
  const scroll = body.scrollTop;
  body.textContent = '';
  SCHEMA.forEach(sec => {
    const d = el('details');
    d.dataset.id = sec.id;
    d.open = first ? !!sec.open : openIds.has(sec.id);
    d.appendChild(el('summary', null, sec.title));
    const inner = el('div', 'sec');
    sec.fields.forEach(f => inner.appendChild(buildField(f)));
    d.appendChild(inner);
    body.appendChild(d);
  });
  body.scrollTop = scroll;
}

function applyAppearance() {
  const root = document.documentElement;
  root.dataset.theme = settings.theme;
  root.style.setProperty('--accent', settings.accent);
  root.style.setProperty('--fs', settings.fontSize + 'px');
  root.style.setProperty('--botfont', { serif: 'var(--serif)', sans: 'var(--sans)', mono: 'var(--mono)' }[settings.botFont] || 'var(--serif)');
  root.style.setProperty('--colw', { narrow: '600px', normal: '720px', wide: '900px' }[settings.width] || '720px');
  document.body.classList.toggle('compact', settings.density === 'compact');
  els.title.textContent = settings.botName || 'My Bot';
  document.title = settings.botName || 'My Bot';
  els.hint.textContent = (settings.enterSends ? 'Enter sends. Shift+Enter starts a new line.' : 'Tap Send to send. Enter starts a new line.') + ' Chats are saved only on this device.';
}

els.thread.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'copycode') { copyText(b.closest('.codeblock').querySelector('code').textContent); return; }
  const chat = cur();
  const i = chat.messages.findIndex(m => m.id === b.dataset.id);
  if (i < 0) return;
  const m = chat.messages[i];
  if (act === 'copy') copyText(m.role === 'user' ? m.content : stripThink(m.content));
  else if (act === 'speak') { if ('speechSynthesis' in window && speechSynthesis.speaking) speechSynthesis.cancel(); else speak(m.content); }
  else if (act === 'del') {
    if (!settings.confirmDelete || confirm('Delete this message?')) { chat.messages.splice(i, 1); saveChats(); render(); }
  } else if (act === 'edit') {
    if (busy) return;
    els.input.value = m.content;
    chat.messages = chat.messages.slice(0, i);
    saveChats(); render(); autosize(); els.input.focus();
    toast('Edit your message, then send it again');
  } else if (act === 'redo') {
    if (busy) return;
    chat.messages.pop();
    showError('');
    generate(chat);
  }
});

els.importFile.addEventListener('change', async () => {
  const f = els.importFile.files[0];
  els.importFile.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    let n = 0;
    if (d.settings && typeof d.settings === 'object') {
      settings = Object.assign(clone(DEFAULTS), d.settings, { apiKey: settings.apiKey });
    }
    if (Array.isArray(d.chats)) {
      d.chats.forEach(c => {
        if (!c || !Array.isArray(c.messages) || chats.some(x => x.id === c.id)) return;
        chats.push({
          id: c.id || uid(), title: String(c.title || 'Imported chat'),
          messages: c.messages.map(m => ({ id: m.id || uid(), role: m.role === 'user' ? 'user' : 'assistant', content: String(m.content || ''), ts: m.ts || Date.now(), stats: m.stats })),
          created: c.created || Date.now(), updated: c.updated || Date.now()
        });
        n++;
      });
    }
    saveSettings(); saveChats(); applyAppearance(); buildSettings(); render();
    toast('Restored ' + n + (n === 1 ? ' chat' : ' chats'));
  } catch (e) { toast('That file could not be read'); }
});

(function init() {
  settings = Object.assign(clone(DEFAULTS), store.get(K.settings, {}));
  if (!Array.isArray(settings.customPresets)) settings.customPresets = [];
  // Upgrade older saved settings to the new unfiltered Nessari + faster memory.
  if (!settings.v2) {
    if (/self-aware, sarcastic AI orchestrator/.test(settings.persona || '')) settings.persona = DEFAULTS.persona;
    if (!settings.contextMsgs) settings.contextMsgs = 16;
    settings.v2 = true;
    store.set(K.settings, settings);
  }
  chats = store.get(K.chats, []);
  if (!Array.isArray(chats)) chats = [];
  // Only chats marked Keep survive to the next visit (old chats count as kept once).
  if (!store.get('mybot2.keepMigrated', false)) { chats.forEach(c => { if (c.keep === undefined) c.keep = true; }); store.set('mybot2.keepMigrated', true); }
  chats = chats.filter(c => c.keep);
  currentId = store.get(K.current, null);
  if (!chats.length) newChat();
  else if (!chats.some(c => c.id === currentId)) currentId = chats[0].id;
  applyAppearance();
  buildSettings();
  render();
  autosize();
  runIntro();
})();

function runIntro() {
  const lines = ['Compiling Architecture...', 'Bribing the orb to glow...', 'Locating a coworker who works...', 'Taking credit for the setup...'];
  let i = 0;
  const step = () => {
    if (!els.intro || els.intro.classList.contains('hide')) return;
    els.introLine.textContent = lines[i % lines.length];
    els.introFill.style.width = Math.min(92, (i + 1) * 26) + '%';
    i++;
  };
  step();
  const timer = setInterval(step, 420);
  const finish = () => {
    clearInterval(timer);
    if (!els.intro) return;
    els.introFill.style.width = '100%';
    setTimeout(() => { els.intro.classList.add('hide'); setTimeout(() => els.intro.remove(), 550); }, 180);
  };
  if (els.introSkip) els.introSkip.addEventListener('click', finish);
  const minWait = new Promise(r => setTimeout(r, 1400));
  Promise.all([reconnect(), minWait]).then(finish).catch(finish);
  setTimeout(finish, 4000);
}
})();
</script>
</body>
</html>
