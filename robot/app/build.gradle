plugins {
    id 'com.android.application'
}

// Version comes from the CI run number so every build installs over the last one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.darkly.robot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.darkly.robot'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "0.2." + buildNumber
        // The S22 is arm64; the bundled model runner is built for arm64 only.
        ndk { abiFilters 'arm64-v8a' }
    }

    // The model runner (llama-server, built by CI into src/main/jniLibs) has to be
    // unpacked onto disk so it can be executed as a process.
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    // The model is stored uncompressed so it can be copied out quickly.
    androidResources {
        noCompress 'gguf'
    }

    // Full build: -PbrainDir=/path/with/brain.gguf puts the offline brain inside the APK.
    if (project.hasProperty('brainDir')) {
        sourceSets.main.assets.srcDirs += [project.property('brainDir')]
    }

    // One fixed key, kept in the repo, so each new build updates the installed
    // app instead of being rejected as a different app. It only proves "this is
    // the same Darkly Robot build as before"; it grants no other access.
    signingConfigs {
        robot {
            storeFile file('../keystore/robot.jks')
            storePassword 'darklyrobot'
            keyAlias 'robot'
            keyPassword 'darklyrobot'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.robot
        }
        debug {
            signingConfig signingConfigs.robot
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
