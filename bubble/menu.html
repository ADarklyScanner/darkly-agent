<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Foam Frenzy</title>
<style>
:root{--bg:#0e0a14;--card:#1b1226;--line:#3a2656;--purple:#b98cff;--text:#f3ecff;--muted:#bda9dc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(120% 80% at 50% 0%,#2a1446 0%,var(--bg) 60%);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 20px calc(32px + env(safe-area-inset-bottom))}
img{width:132px;height:132px;border-radius:32px;box-shadow:0 12px 40px rgba(185,140,255,.35)}
h1{font-size:30px;font-weight:800;letter-spacing:.3px;text-align:center}
.modes{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
a.mode{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;transition:transform .08s}
a.mode:active{transform:scale(.97)}
a.mode b{display:block;font-size:22px;font-weight:800;color:var(--purple)}
a.mode span{display:block;margin-top:4px;font-size:15px;color:var(--muted)}
footer{font-size:12px;color:#7d6a99}
</style></head>
<body><main>
<img src="/logo.png" alt="">
<h1>Bubble Foam Frenzy</h1>
<div class="modes">
  <a class="mode" href="https://frenzy.darkly/"><b>Frenzy</b><span>Seven difficulty levels, from Zen to Frenzy</span></a>
  <a class="mode" href="https://classic.darkly/"><b>Classic</b><span>The original. One bubble, one clock.</span></a>
</div>
<footer>Darkly Scanner</footer>
</main></body></html>
